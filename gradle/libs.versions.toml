[versions]
kotlin                  = "2.0.21"
kotlinx-coroutines      = "1.9.0"
kotlinx-serialization   = "1.7.1"
ktor                    = "2.3.12"
firebase-android        = "33.1.0"
hilt                    = "2.51.1"
compose-bom             = "2024.09.00"
androidx-lifecycle      = "2.8.5"
androidx-navigation     = "2.8.0"
androidx-camera         = "1.3.4"
androidx-work           = "2.9.1"
androidx-biometric      = "1.2.0-alpha05"
androidx-security       = "1.1.0-alpha06"
google-material         = "1.12.0"
icons-lucide            = "2.2.1"
ksp                     = "2.0.21-1.0.27"

[libraries]
kotlinx-coroutines-core    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

ktor-client-cio            = { module = "io.ktor:ktor-client-cio",                 version.ref = "ktor" }
ktor-client-content-neg    = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

firebase-bom               = { module = "com.google.firebase:firebase-bom",            version.ref = "firebase-android" }
firebase-auth              = { module = "com.google.firebase:firebase-auth-ktx" }
firebase-firestore         = { module = "com.google.firebase:firebase-firestore-ktx" }
firebase-storage           = { module = "com.google.firebase:firebase-storage-ktx" }
firebase-messaging         = { module = "com.google.firebase:firebase-messaging-ktx" }
firebase-crashlytics       = { module = "com.google.firebase:firebase-crashlytics-ktx" }

compose-bom                = { module = "androidx.compose:compose-bom",                version.ref = "compose-bom" }
compose-ui                 = { module = "androidx.compose.ui:ui" }
compose-material3          = { module = "androidx.compose.material3:material3" }
compose-activity           = { module = "androidx.activity:activity-compose",          version = "1.9.2" }
compose-icons-lucide       = { module = "com.composables:icons-lucide",               version.ref = "icons-lucide" }
compose-navigation         = { module = "androidx.navigation:navigation-compose",      version.ref = "androidx-navigation" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
lifecycle-runtime-compose  = { module = "androidx.lifecycle:lifecycle-runtime-compose",    version.ref = "androidx-lifecycle" }
coil-compose               = { module = "io.coil-kt:coil-compose",                     version = "2.6.0" }

hilt-android               = { module = "com.google.dagger:hilt-android",              version.ref = "hilt" }
hilt-compiler              = { module = "com.google.dagger:hilt-compiler",             version.ref = "hilt" }
hilt-work                  = { module = "androidx.hilt:hilt-work",                     version = "1.2.0" }
hilt-navigation-compose    = { module = "androidx.hilt:hilt-navigation-compose",      version = "1.2.0" }

camera-view                = { module = "androidx.camera:camera-view",    version.ref = "androidx-camera" }
camera-core                = { module = "androidx.camera:camera-core",    version.ref = "androidx-camera" }
camera-camera2             = { module = "androidx.camera:camera-camera2", version.ref = "androidx-camera" }
camera-lifecycle           = { module = "androidx.camera:camera-lifecycle",version.ref = "androidx-camera" }
work-runtime               = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }
biometric                  = { module = "androidx.biometric:biometric",   version.ref = "androidx-biometric" }
security-crypto            = { module = "androidx.security:security-crypto",version.ref = "androidx-security" }
google-material            = { module = "com.google.android.material:material", version.ref = "google-material" }
guava                      = { module = "com.google.guava:guava",          version = "33.2.1-android" }

[plugins]
androidApplication  = { id = "com.android.application",            version = "8.5.2" }
kotlinAndroid       = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlinCompose       = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
googleServices      = { id = "com.google.gms.google-services",      version = "4.4.2" }
crashlytics         = { id = "com.google.firebase.crashlytics",     version = "3.0.2" }
ksp                 = { id = "com.google.devtools.ksp",             version.ref = "ksp" }
hilt                = { id = "com.google.dagger.hilt.android",      version.ref = "hilt" }
