name: PALM CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: palm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Normalize the pending combobox source edit
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/palm-ci-green'
        run: |
          pnpm exec prettier --write packages/components/src/components/combobox.tsx
          cp packages/components/src/components/combobox.tsx "$RUNNER_TEMP/combobox.tsx"
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          cp "$RUNNER_TEMP/combobox.tsx" packages/components/src/components/combobox.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/components/src/components/combobox.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(combobox): apply repository formatting"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Run quality gate
        run: pnpm check

  browser:
    name: Browser contracts and accessibility
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build packages
        run: pnpm build
      - name: Run browser contracts and accessibility
        run: pnpm test:e2e
